<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Turn on multi-factor authentication poster</title>
  <desc id="description">A blue NCAP awareness poster showing a secure padlock and the message extra security, extra confidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08245a"/>
      <stop offset="0.58" stop-color="#0645bf"/>
      <stop offset="1" stop-color="#0c7fea"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c7ff"/>
      <stop offset="1" stop-color="#0765f4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#00194a" flood-opacity=".38"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#fff" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="960" height="720" rx="34" fill="url(#background)"/>
  <circle cx="860" cy="82" r="220" fill="#22bff7" opacity=".15"/>
  <circle cx="805" cy="650" r="270" fill="#001f66" opacity=".3"/>
  <path d="M0 535C170 460 315 505 470 590s290 86 490-10v140H0Z" fill="#031b4e" opacity=".45"/>
  <rect x="680" y="38" width="230" height="180" fill="url(#dots)"/>
  <g fill="#fff">
    <text x="66" y="92" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">CYBER SAFETY ESSENTIAL</text>
    <text x="66" y="178" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">TURN ON MFA</text>
    <text x="66" y="230" font-family="Arial, sans-serif" font-size="31" font-weight="700">EXTRA SECURITY.</text>
    <text x="66" y="270" font-family="Arial, sans-serif" font-size="31" font-weight="700">EXTRA CONFIDENCE.</text>
  </g>
  <g transform="translate(566 220)" filter="url(#shadow)">
    <rect x="0" y="120" width="250" height="238" rx="44" fill="url(#lock)"/>
    <path d="M62 126V85C62 13 188 13 188 85v41" fill="none" stroke="#79ddff" stroke-width="34" stroke-linecap="round"/>
    <circle cx="125" cy="226" r="29" fill="#ffbd2e"/>
    <path d="m112 245-8 50h42l-8-50" fill="#ffbd2e"/>
    <path d="m207 322 21 21 42-49" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(66 592)" fill="#fff">
    <path d="M32 0 62 12v26c0 29-18 48-30 55C20 86 2 67 2 38V12Zm0 16-15 6v17c0 17 9 29 15 35 7-6 15-18 15-35V22Z"/>
    <text x="82" y="33" font-family="Arial, sans-serif" font-size="31" font-weight="800">NCAP</text>
    <text x="82" y="57" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">NATIONAL CYBER AWARENESS</text>
  </g>
</svg>
