<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Turn On MFA</title><desc id="d">NCAP poster explaining multi-factor authentication</desc><rect width="1200" height="900" fill="#effbf8"/><rect x="55" y="55" width="1090" height="790" rx="28" fill="#fff" stroke="#16846f" stroke-width="8"/><text x="105" y="150" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#16846f">NCAP • ACCOUNT SECURITY</text><text x="105" y="285" font-family="Arial,sans-serif" font-size="92" font-weight="700" fill="#17151f">Turn on MFA.</text><text x="105" y="355" font-family="Arial,sans-serif" font-size="34" fill="#667085">A stolen password should not be enough.</text><g font-family="Arial,sans-serif"><circle cx="200" cy="540" r="68" fill="#4430a5"/><text x="180" y="559" font-size="54" fill="#fff">1</text><text x="300" y="530" font-size="36" font-weight="700" fill="#17151f">Your password</text><text x="300" y="575" font-size="28" fill="#667085">Something you know</text><circle cx="200" cy="700" r="68" fill="#f2740e"/><text x="180" y="719" font-size="54" fill="#fff">2</text><text x="300" y="690" font-size="36" font-weight="700" fill="#17151f">Your device or passkey</text><text x="300" y="735" font-size="28" fill="#667085">Something you have</text></g></svg>
