<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Keep Your Phone Secure</title><desc id="d">NCAP mobile security checklist poster</desc><rect width="1200" height="900" fill="#eef5ff"/><rect x="55" y="55" width="1090" height="790" rx="28" fill="#fff" stroke="#4430a5" stroke-width="8"/><text x="105" y="150" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#4430a5">NCAP • MOBILE SECURITY</text><text x="105" y="275" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#17151f">Your phone holds</text><text x="105" y="355" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#4430a5">your digital life.</text><g font-family="Arial,sans-serif" font-size="34" fill="#17151f"><text x="150" y="485">□ Set a six-digit PIN and biometrics</text><text x="150" y="565">□ Enable automatic updates</text><text x="150" y="645">□ Review app permissions</text><text x="150" y="725">□ Turn on find-my-device</text></g><text x="105" y="805" font-family="Arial,sans-serif" font-size="24" fill="#667085">Ten minutes now. Much less exposure later.</text></svg>
