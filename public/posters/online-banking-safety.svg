<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Online Banking Safety</title><desc id="d">NCAP poster with checks before sending money</desc><rect width="1200" height="900" fill="#fff8ed"/><rect x="55" y="55" width="1090" height="790" rx="28" fill="#fff" stroke="#f2740e" stroke-width="8"/><text x="105" y="150" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f2740e">NCAP • ONLINE BANKING</text><text x="105" y="275" font-family="Arial,sans-serif" font-size="75" font-weight="700" fill="#17151f">Check before</text><text x="105" y="355" font-family="Arial,sans-serif" font-size="75" font-weight="700" fill="#4430a5">you send.</text><g font-family="Arial,sans-serif" font-size="33" fill="#17151f"><text x="150" y="490">1  Open your own banking app or bookmark</text><text x="150" y="570">2  Confirm new payee details by voice</text><text x="150" y="650">3  Read the name and number twice</text><text x="150" y="730">4  Never share an OTP with a caller</text></g><text x="105" y="805" font-family="Arial,sans-serif" font-size="24" fill="#667085">Urgency is a reason to pause—not to pay.</text></svg>
