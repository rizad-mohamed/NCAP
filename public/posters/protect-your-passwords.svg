<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Protect Your Passwords</title><desc id="d">NCAP poster about passphrases and password managers</desc><rect width="1200" height="900" fill="#fff7ef"/><circle cx="955" cy="180" r="135" fill="#f2740e" opacity=".18"/><rect x="58" y="58" width="1084" height="784" rx="28" fill="#fff" stroke="#f2740e" stroke-width="8"/><text x="105" y="150" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f2740e">NCAP • PASSWORDS</text><text x="105" y="275" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#17151f">One account.</text><text x="105" y="355" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#4430a5">One unique password.</text><g font-family="Arial,sans-serif" font-size="34" fill="#17151f"><text x="145" y="495">✓ Use a long, unrelated-word passphrase</text><text x="145" y="575">✓ Let a password manager remember it</text><text x="145" y="655">✓ Turn on multi-factor authentication</text></g><text x="105" y="790" font-family="Arial,sans-serif" font-size="26" fill="#667085">Reuse turns one breach into many.</text></svg>
