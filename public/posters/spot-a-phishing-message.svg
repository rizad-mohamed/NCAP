<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Spot a Phishing Message</title><desc id="d">NCAP poster showing four checks for suspicious messages</desc><rect width="1200" height="900" fill="#f4f1ff"/><rect x="54" y="54" width="1092" height="792" rx="28" fill="#fff" stroke="#4430a5" stroke-width="8"/><text x="100" y="145" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#6f5ff9">NCAP • PHISHING</text><text x="100" y="250" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#17151f">Spot a phishing</text><text x="100" y="330" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#4430a5">message.</text><g font-family="Arial,sans-serif" font-size="34" fill="#17151f"><text x="145" y="455">1  Check the full sender address</text><text x="145" y="535">2  Preview links before opening</text><text x="145" y="615">3  Question urgency and secrecy</text><text x="145" y="695">4  Confirm through a trusted channel</text></g><rect x="100" y="755" width="1000" height="5" fill="#f2740e"/><text x="100" y="808" font-family="Arial,sans-serif" font-size="24" fill="#667085">Pause • Check • Confirm</text></svg>
