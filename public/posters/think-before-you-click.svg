<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Think Before You Click</title><desc id="d">NCAP poster showing stop, check and confirm</desc><rect width="1200" height="900" fill="#f5f3ff"/><rect x="55" y="55" width="1090" height="790" rx="28" fill="#fff" stroke="#6f5ff9" stroke-width="8"/><text x="105" y="150" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#6f5ff9">NCAP • SAFE BROWSING</text><text x="105" y="270" font-family="Arial,sans-serif" font-size="82" font-weight="700" fill="#17151f">Think before</text><text x="105" y="355" font-family="Arial,sans-serif" font-size="82" font-weight="700" fill="#4430a5">you click.</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="250" cy="590" r="112" fill="#f2740e"/><text x="250" y="604" font-size="42" font-weight="700" fill="#fff">STOP</text><circle cx="600" cy="590" r="112" fill="#6f5ff9"/><text x="600" y="604" font-size="42" font-weight="700" fill="#fff">CHECK</text><circle cx="950" cy="590" r="112" fill="#16846f"/><text x="950" y="604" font-size="35" font-weight="700" fill="#fff">CONFIRM</text><text x="600" y="785" font-size="25" fill="#667085">A two-minute check can prevent a long recovery.</text></g></svg>
